{# Sidebar for standalone doctor pages. Set  nav_active  to: dashboard | appointments | alerts | risk | scans | prescriptions | records #}
<aside class="sidebar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2 8 4-16 2 8h8"/></svg>
    </span>
    Sukham
  </div>

  <nav class="sidebar-nav">
    <a href="/doctor/dashboard" class="nav-item {{ 'active' if nav_active == 'dashboard' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
      Dashboard
    </a>
    <a href="/doctor/appointments" class="nav-item {{ 'active' if nav_active == 'appointments' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
      Appointments
    </a>
    <a href="/doctor/alerts" class="nav-item {{ 'active' if nav_active == 'alerts' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      Patient Alerts
      <span data-alert-badge style="margin-left:auto;background:#c62828;color:#fff;border-radius:999px;padding:1px 8px;font-size:0.75rem;font-weight:700;" {{ 'hidden' if not open_alert_count(doctor.id) }}>{{ open_alert_count(doctor.id) }}</span>
    </a>
    <a href="/doctor/risk" class="nav-item {{ 'active' if nav_active == 'risk' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      Risk Scoring
    </a>
    <a href="/doctor/scans" class="nav-item {{ 'active' if nav_active == 'scans' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
      Scan Review
    </a>
    <a href="/doctor/prescriptions" class="nav-item {{ 'active' if nav_active == 'prescriptions' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><path d="M9 15h6M9 11h6"/></svg>
      Prescriptions
    </a>
    <a href="/doctor/dashboard#records" class="nav-item {{ 'active' if nav_active == 'records' }}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      Records
    </a>
  </nav>

  <div class="sidebar-footer">
    <a href="/doctor/logout" class="nav-item" style="color:var(--text-dim);">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Log out
    </a>
  </div>
</aside>
<script src="/static/js/doctor_alert_poll.js" defer></script>
